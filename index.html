<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>D'Anjung Cottage</title>

  <!-- D'Anjung Cottage favicon -->
  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="https://raw.githubusercontent.com/haziqaazmi/website/main/images/logo.png">

  <!-- iPhone / iPad -->
  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="https://raw.githubusercontent.com/haziqaazmi/website/main/images/logo.png">

  <!-- Mobile browser theme -->
  <meta
    name="theme-color"
    content="#17211d">

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .app-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

  </style>

</head>


<body>

  <div class="app-container">

    <iframe
      src="https://script.google.com/macros/s/AKfycbxBV6fYHsKpkBIM8g9xslpr6iz__IfvW7ybHvEdQ1Kc0zh3BZr4JZzpKqTLzV881lNviA/exec"
      allow="geolocation"
      allowfullscreen>
    </iframe>

  </div>


</body>

</html>
