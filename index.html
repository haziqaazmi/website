<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    .app-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-width: 100%;
      min-height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>

  <div class="app-container">
    <iframe
      src="https://script.google.com/macros/s/AKfycbxBV6fYHsKpkBIM8g9xslpr6iz__IfvW7ybHvEdQ1Kc0zh3BZr4JZzpKqTLzV881lNviA/exec"
      allow="geolocation"
      allowfullscreen>
    </iframe>
  </div>

</body>
</html>
